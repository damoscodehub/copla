[package]
name = "copla"
version = "0.1.0"
description = "A local image comparison workspace"
authors = ["damo"]
license = "MIT"
homepage = "https://github.com/damoscodehub/copla"
repository = "https://github.com/damoscodehub/copla"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
base64 = "0.22"
tempfile = "3"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
kamadak-exif = "0.6"
pathdiff = "0.2"
fs2 = "0.4"

[profile.release]
strip = true
lto = "thin"
